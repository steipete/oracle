name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm run lint
      - run: pnpm run docs:check
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm run docs:site
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm run test
      - run: pnpm run build
      - name: Prove browser transport reuse and idle process exit
        run: node scripts/browser-connection-proof.mjs
      - name: Prove shared Chrome controller lifetime on Windows
        if: matrix.os == 'windows-latest'
        run: node scripts/shared-chrome-lifecycle-proof.mjs
      - run: pnpm run test:packed-cli
        if: matrix.os == 'ubuntu-latest'

  # Linux parity smokes for CDP disconnect classification and attachment sends.
  # No ChatGPT auth; exercises real Chromium DevTools and disk-backed uploads.
  cdp-disconnect-proof-linux:
    strategy:
      fail-fast: false
      matrix:
        suite: [core, attachment-context]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Resolve Chrome or install Chromium
        shell: bash
        run: |
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
          CHROME_PATH=/usr/bin/chromium-browser
          if [[ ! -x "${CHROME_PATH}" ]]; then
            if [[ -x /usr/bin/chromium ]]; then
              export CHROME_PATH=/usr/bin/chromium
            else
              echo "Chromium binary not found" >&2
              exit 1
            fi
          fi
          echo "CHROME_PATH=${CHROME_PATH}" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run CDP disconnect classification proof
        if: matrix.suite == 'core'
        run: node scripts/cdp-disconnect-proof.mjs
      - name: Run built CLI artifact export proof
        if: matrix.suite == 'core'
        run: node scripts/artifact-export-proof.mjs
      - name: Run shared Chrome lifecycle proof
        if: matrix.suite == 'core'
        run: node scripts/shared-chrome-lifecycle-proof.mjs
      - name: Run service admission and cancellation proof
        if: matrix.suite == 'core'
        run: node scripts/serve-queue-proof.mjs
      - name: Run attachment send proof
        if: matrix.suite == 'core'
        run: node scripts/attachment-send-proof.mjs
      - name: Run built CLI attachment context proof
        if: matrix.suite == 'attachment-context'
        run: node scripts/attachment-cli-proof.mjs
      - name: Run effort slider readiness proof
        if: matrix.suite == 'core'
        run: node scripts/effort-readiness-proof.mjs
